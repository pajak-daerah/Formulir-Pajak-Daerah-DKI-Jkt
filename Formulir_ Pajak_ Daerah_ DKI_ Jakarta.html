<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengisian Formulir Pajak Daerah DKI Jakarta</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--ink:#111111;--title-bg:#e3a1e0;--title-ink:#111111;--shadow:#111111;
--c1:#ffd6d6;--c2:#ffe3b8;--c3:#fff6b0;--c4:#d3f5c0;--c5:#bff0e4;--c6:#c4e6ff;--c7:#d3d4ff;--c8:#ecd0ff;--c9:#ffc9e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--ink:#f2f2f2;--title-bg:#b36fb0;--title-ink:#111111;--shadow:#f2f2f2;
--c1:#e99a9a;--c2:#e8b978;--c3:#e6d76a;--c4:#8fd070;--c5:#74d1bb;--c6:#7dbbec;--c7:#9a9cf0;--c8:#c797ee;--c9:#ec8fc3}}
:root[data-theme="dark"]{--bg:#15151a;--ink:#f2f2f2;--title-bg:#b36fb0;--title-ink:#111111;--shadow:#f2f2f2;
--c1:#e99a9a;--c2:#e8b978;--c3:#e6d76a;--c4:#8fd070;--c5:#74d1bb;--c6:#7dbbec;--c7:#9a9cf0;--c8:#c797ee;--c9:#ec8fc3}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
.head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.logo{width:92px;height:auto;display:block;background:#fff;border-radius:4px}
.title{background:var(--title-bg);color:var(--title-ink);text-align:center;font-weight:800;font-size:clamp(17px,4.6vw,24px);line-height:1.3;padding:20px 14px;letter-spacing:.2px}
.body{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:stretch;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px 6px;border:2.5px solid var(--ink);border-radius:3px;
color:#111;font-family:inherit;font-weight:900;font-size:clamp(12px,3.1vw,15px);line-height:1.1;-webkit-text-stroke:.6px #111;letter-spacing:.3px;text-decoration:none;cursor:pointer;
box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.monas{width:84px;height:100%;min-height:0;object-fit:fill;display:block;align-self:stretch}
.sub{display:grid;gap:18px;max-width:300px;margin:26px auto 0}.sub[hidden]{display:none}.sub .btn{background:#fff;min-height:40px;border-radius:2px}.sub h2{margin:0;text-align:center;font-size:17px;font-weight:900}.back{justify-self:start;background:none;border:0;color:var(--ink);font:700 14px inherit;font-family:inherit;cursor:pointer;padding:4px 0}.back:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.note{margin-top:22px;text-align:center;font-size:13px;min-height:1.4em;opacity:.8}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;margin:30px auto 0;flex-wrap:wrap}
.fbox{display:flex;flex-direction:column;border:2px solid #111;color:#111;font-weight:900;font-size:clamp(11px,2.9vw,14px);text-align:center;min-width:92px;-webkit-text-stroke:.4px #111}
.fbox span{padding:3px 8px;line-height:1.2}
.fbox.b1 span{background:#c4e6ff}.fbox.b1 span+span{border-top:2px solid #111}
.fbox.b2 span{background:#ffff00}.fbox.b2 span+span{border-top:2px solid #111}
.fbox.b3{background:#7fe08e;justify-content:center;min-height:48px;padding:0 22px}
.farrow{width:30px;height:28px;flex:none}
@media (max-width:420px){.body{grid-template-columns:1fr}.monas{display:none}.logo{width:72px}.farrow{width:22px}.fbox.b3{padding:0 12px}}
</style>
</head>

const grid = document.getElementById("grid");
const note = document.getElementById("note");
PAJAK.forEach(p => {
  const a = document.createElement("a");
  a.className = "btn";
  a.textContent = p.nama;
  a.style.background = p.warna;
  a.href = p.href || "#";
  a.addEventListener("click", e => {
    if (p.sub || p.gambar) { e.preventDefault(); showSub(p); return; }
    if (!p.href) { e.preventDefault(); note.textContent = "Formulir " + p.nama + " belum dihubungkan."; }
  });
  grid.appendChild(a);
});
const main = document.querySelector(".body"), sub = document.getElementById("sub"), subgrid = document.getElementById("subgrid");
function showSub(p){
  subgrid.innerHTML = ""; note.textContent = "";
  document.getElementById("subtitle").textContent = p.nama;
  document.getElementById("subtitle").hidden = !!p.tanpaJudul;
  sub.setAttribute("aria-label", "Menu " + p.nama);
  sub.style.maxWidth = p.gambar ? "none" : "";
  if (p.gambar) { const im = document.createElement("img"); im.src = IMG_REKLAME; im.alt = "Pajak Membangun Jakarta"; im.style.cssText = "width:100%;height:auto;display:block;border:2.5px solid var(--ink);border-radius:3px"; subgrid.appendChild(im); }
  (p.sub || []).forEach(s => {
    const a = document.createElement("a");
    a.className = "btn"; a.textContent = s.nama; a.href = s.href || "#";
    a.addEventListener("click", e => { if (!s.href) { e.preventDefault(); note.textContent = "Formulir " + s.nama + " belum dihubungkan."; } });
    subgrid.appendChild(a);
  });
  main.hidden = true; main.style.display = "none"; document.getElementById("flow").style.display = "none"; sub.hidden = false;
}
document.getElementById("back").addEventListener("click", () => {
  sub.style.maxWidth = ""; sub.hidden = true; main.hidden = false; main.style.display = ""; document.getElementById("flow").style.display = ""; note.textContent = "";
});
</script>
