<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}

<script>
const $=id=>document.getElementById(id);
const PW=595.28,PH=841.89; /* A4 */
const FJ={A:['helvetica','normal'],AB:['helvetica','bold'],AI:['helvetica','italic'],T:['times','normal'],TB:['times','bold']};
const SUB=[['nama','Nama'],['jalan','Nama Jalan'],['blok','Blok / Kav / Nomor'],['rt','RT / RW'],['kel','Kelurahan'],['kec','Kecamatan'],['kota','Kota']];
const OBJ=[['jalan','Nama Jalan'],['blok','Blok / Kav / Nomor'],['rt','RT / RW'],['lt','Luas Tanah (M2)'],['lb','Luas Bangunan (M2)'],['jb','Jenis Bangunan']];
const CB=[['pb','Pendaftaran Baru'],['pn','Pembetulan nama'],['fs','Perubahan Status Menjadi','sel'],['bn','Balik nama'],['pa','Pembetulan Alamat'],['bt','Pembatalan SPPT PBB Tahun','txt','Tahun'],['pg','Penggabungan'],['lt','Perubahan Luas Tanah'],['sb','Perubahan status bangunan menjadi','txt','Menjadi'],['hn','Penghapusan NOP'],['lb','Perubahan Luas Bangunan'],['sl','Salinan Tahun','txt','Tahun']];
const KA=['Jakarta Pusat','Jakarta Utara','Jakarta Barat','Jakarta Selatan','Jakarta Timur'];
const UP=[['Jakarta Pusat',['Gambir','Tanah Abang','Menteng','Senen','Cempaka Putih','Johar Baru','Kemayoran','Sawah Besar']],['Jakarta Utara',['Penjaringan','Tanjung Priok','Pademangan','Koja','Cilincing','Kelapa Gading']],['Jakarta Barat',['Cengkareng','Grogol Petamburan','Kalideres','Kebon Jeruk','Kembangan','Palmerah','Taman Sari','Tambora']],['Jakarta Selatan',['Kebayoran Baru','Kebayoran Lama','Pesanggrahan','Cilandak','Pasar Minggu','Jagakarsa','Mampang Prapatan','Pancoran','Tebet','Setiabudi']],['Jakarta Timur',['Matraman','Pulo Gadung','Jatinegara','Duren Sawit','Kramat Jati','Makasar','Pasar Rebo','Ciracas','Cipayung','Cakung']]];
const JB=[['Rumah',['1a. Rumah Tinggal','1b. Rumah Dikontrakkan','1c. Rumah Kos / Guesthouse','1d. Rumah Tinggal yang juga digunakan sebagai Tempat Usaha']],['Perkantoran / Universitas',['2a. Perkantoran Swasta','2b. Perkantoran BUMN / BUMD','2c. Universitas Negeri','2d. Universitas Swasta / Sejenis','2e. Mixed Use']],['Toko / Ruko / Rukan / dll',['4a. Toko / Kios / Apotek / Bengkel Motor','4b. Ruko / Rukan','4c. Restoran / Kafe','4d. Ruko / Rukan yang digunakan sepenuhnya menjadi tempat tinggal']],['Rumah Sakit / Klinik',['5a. Rumah Sakit Pemerintah','5b. Rumah Sakit Swasta','5c. Klinik / Sejenis','5d. Laboratorium Klinik']],'3. Pabrik','4. Gymnasium','5. Gedung Pemerintah','6. Lain-Lain',['Hotel',['7a. Hotel','7b. Wisma','7c. Asrama / Mess','7d. Motel / Losmen / Hostel / Sejenis']],['Bengkel / Gudang / Pertanian / Peternakan',['8a. Bengkel / Showroom Mobil','8b. Gudang','8c. Bangunan Pertanian / Peternakan','8d. Workshop']],['Bangunan Tidak Kena Pajak',['11a. Rumah Ibadat','11b. Kedutaan']],'12. Bangunan Parkir',['Rumah Susun',['13a. Rumah Susun / Apartemen','13b. Kondominium / Kondotel / Apartemen Sewa / Flat','13c. Rusunawa','13d. Rumah Susun Mixed Use']],'14. Kanopi Pompa Bensin','15. Tangki Minyak / Tangki',['Gedung Sekolah',['16a. Gedung Sekolah Negeri','16b. Gedung Sekolah Swasta']],['Objek Khusus',['17a. Jalan Tol','17b. Bandar Udara / Lapangan Terbang','17c. Stasiun Kereta Api / LRT / MRT','17d. Bendungan','17e. Pelabuhan / Dermaga / Galangan Kapal / Jetty','17f. Lapangan Golf','17g. Stadion','17h. Sirkuit Balap','17i. Pabrik Semen / Pupuk','17j. Tempat Rekreasi','17k. Tempat Penampungan / Kilang Minyak, Air, atau Gas','17l. Pipa Minyak, Air, atau Gas','17m. Stasiun Pengisian Bahan Bakar / SPKLU','17n. Menara / SUTET / SUTT','17o. Objek Khusus Lainnya','17p. Terminal Bus / Halte','17q. Tempat Parkir Kontainer / Alat Berat','17r. Pusat Perbelanjaan / Mall / Sejenis','17s. Pasar / Swalayan','17t. Hanggar']]];
const nn=t=>t.replace(/^\d+[a-z]?\.\s*/,'');
const ids=()=>[...document.querySelectorAll('#f input,#f textarea,#f select')];

/* ---------- formulir ---------- */
const opt=a=>a.map(g=>typeof g==='string'?'<option>'+g+'</option>':'<optgroup label="'+g[0]+'">'+g[1].map(n=>'<option>'+n+'</option>').join('')+'</optgroup>').join('');
const SEL=(id,o,ne)=>'<select id="'+id+'">'+(ne?'':'<option value="">— Pilih —</option>')+o+'</select>';
const I=(id,x)=>'<input id="'+id+'" '+(x||'')+'>';
const TA=id=>'<textarea id="'+id+'" rows="2"></textarea>';
const R=(l,c)=>'<tr><td>'+l+'</td><td>:</td><td>'+c+'</td></tr>';
const SEC=(t,f)=>'<div class="sec'+(f?' f':'')+'">'+t+'</div>';
const TB=r=>'<table class="id" style="border:1px solid #000;border-top:0">'+r+'</table>';
const HD=(t,cls)=>'<tr><td colspan="3"'+(cls?' class="'+cls+'"':'')+'><b>'+t+'</b></td></tr>';
const JBO=opt(JB.map(g=>typeof g==='string'?nn(g):[g[0],g[1].map(nn)]));
const flds=(list,pre)=>list.map(r=>R(r[1],r[0]==='jb'?SEL(pre+'jb',JBO):I(pre+r[0]))).join('');
function build(){
 let h='<div class="judul">SURAT PERMOHONAN PBB-P2</div>';
 h+=SEC('Surat',1)+TB(R('Wilayah UPPPD',SEL('upp',opt(UP)))+R('Kota administrasi',SEL('adm',opt(KA)))+R('Tanggal',I('tgl','type="date" style="width:170px"')));
 h+=SEC('Wajib pajak (pemohon)')+TB(R('Nama',I('nama'))+R('No. KTP',I('ktp','inputmode="numeric" maxlength="16"'))+R('No. Telp',I('telp','type="tel"'))+R('No. HP',I('hp','type="tel"'))+R('Nama penandatangan',I('ttd','placeholder="kosong = nama pemohon"')));
 h+=SEC('Jenis permohonan')+TB(CB.map(c=>{
  let ex='';if(c[2]==='sel')ex=SEL('x_fs',opt(['Fasum','Non Fasum']),1);else if(c[2]==='txt')ex=I('x_'+c[0],'placeholder="'+c[3]+'"');
  return '<tr><td colspan="2" style="width:300px"><label class="ck"><input type="checkbox" id="c_'+c[0]+'">'+c[1]+'</label></td><td>'+ex+'</td></tr>'}).join(''));
 h+=SEC('Permohonan lainnya (opsional)')+TB('<tr><td colspan="3">'+TA('lain')+'</td></tr>');
 h+=SEC('Objek pajak')+TB(R('NOP (18 digit)',I('nop','inputmode="numeric" placeholder="00.00.000.000.000-0000.0"'))+R('Atas Nama',I('an'))+R('Yang berlokasi di',TA('lokasi')));
 h+=SEC('Data SPPT PBB saat ini')+TB(HD('Isi data sebelum perubahan','warn')+R('Tahun SPPT',I('tahun','inputmode="numeric" maxlength="4" style="width:120px"'))+HD('Data subjek pajak')+flds(SUB,'as_')+HD('Data objek pajak')+flds(OBJ,'ao_'));
 h+=SEC('Perubahan data menurut pemohon')+TB(HD('Isi data yang mengalami perubahan saja','warn')+R('Data subjek sesuai',SEL('ident',opt(['KTP','NPWP Badan']),1))+HD('Data subjek pajak menjadi')+flds(SUB,'bs_')+HD('Data objek pajak menjadi')+flds(OBJ,'bo_'));
 h+=SEC('Alasan pengajuan permohonan')+TB('<tr><td colspan="3">'+TA('alasan')+'</td></tr>');
 $('f').innerHTML=h}
function today(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function defaults(){ids().forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(x.tagName==='SELECT')x.selectedIndex=0;else x.value=''});$('tgl').value=today()}
function reset(){if(confirm('Kosongkan semua isian?'))defaults()}
function fmtNop(s){const d=s.replace(/\D/g,'').slice(0,18),p=[2,2,3,3,3,4,1],o=[];let i=0;
 p.forEach(n=>{const c=d.substr(i,n);i+=n;if(c)o.push(c)});
 return o.length>=6?o.slice(0,5).join('.')+'-'+o[5]+(o[6]?'.'+o[6]:''):o.join('.')}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nop')t.value=fmtNop(t.value);
 if(t.id==='ktp')t.value=t.value.replace(/\D/g,'')});
function vals(){const V={};ids().forEach(x=>{if(!x.id)return;
 if(x.type==='checkbox'){V[x.id]=x.checked;return}
 let v=x.value.replace(/\s+/g,' ').trim();
 if(v&&x.type==='date'){const d=new Date(v+'T00:00:00');v=d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
 V[x.id]=v});V.kota='Jakarta';return V}

/* ---------- tata letak surat (A4) ---------- */
function lay(B,V,b){
 const L=40,R=PW-40,CW=R-L,SZ=b,LH=b*1.34;let y=38,over=false;
 const W=(s,sz=SZ,f='A')=>B.w(s,sz,f);
 const T=(s,x,yy,sz=SZ,f='A')=>B.text(s,x,yy,sz,f);
 const dots=n=>'.'.repeat(n);
 const wrap=(s,mw,sz=SZ,f='A')=>{const out=[];let cur='';
  s.split(/\s+/).filter(Boolean).forEach(w=>{
   while(W(w,sz,f)>mw){let i=w.length-1;while(i>1&&W(w.slice(0,i),sz,f)>mw)i--;if(cur){out.push(cur);cur=''}out.push(w.slice(0,i));w=w.slice(i)}
   const t=cur?cur+' '+w:w;if(!cur||W(t,sz,f)<=mw)cur=t;else{out.push(cur);cur=w}});
  if(cur)out.push(cur);return out};
 const segW=(segs,sz,f)=>segs.reduce((a,s)=>a+W(s.t,sz,f),0);
 const segs=(x,yy,sg,sz,f)=>{let cx=x;sg.forEach(s=>{T(s.t,cx,yy,sz,f);const w=W(s.t,sz,f);if(s.s)B.line(cx,yy-sz*.3,cx+w,yy-sz*.3,.6);cx+=w});return cx-x};
 const C=(s,cx,yy,sz=SZ,f='A')=>T(s,cx-W(s,sz,f)/2,yy,sz,f);

 const xk=L+CW/2+6;
 const tt=(V.kota||dots(16))+', '+(V.tgl||dots(14));T(tt,xk,y);y+=LH*1.7;
 T('Kepada :',xk,y);y+=LH;
 wrap('Yth. Kepala Unit Pelayanan Pemungutan Pajak Daerah '+(V.upp||dots(14))+' di '+(V.adm||dots(16)),R-xk).forEach(s=>{T(s,xk,y);y+=LH});
 y+=LH*.5;
 T('Saya yang bertanda tangan dibawah ini :',L,y);y+=LH*1.1;
 const colW=CW/2-6,lw=58,xr=L+CW/2+6;
 const pr=(l1,v1,l2,v2)=>{const a=wrap(v1||dots(20),colW-lw-8),c=wrap(v2||dots(20),colW-lw-8),n=Math.max(a.length,c.length);
  T(l1,L,y);T(':',L+lw,y);a.forEach((s,i)=>T(s,L+lw+8,y+i*LH));
  T(l2,xr,y);T(':',xr+lw,y);c.forEach((s,i)=>T(s,xr+lw+8,y+i*LH));y+=n*LH};
 pr('Nama',V.nama,'No. Telp',V.telp);pr('No. KTP',V.ktp,'No. HP',V.hp);
 y+=LH*.5;
 T('adalah sebagai Wajib Pajak / Kuasanya dengan ini mengajukan permohonan :',L,y);y+=LH*1.3;

 /* kotak centang, 3 kolom */
 const bw=SZ*.85;
 const items=CB.map(c=>{let sg=[{t:c[1]}];
  if(c[2]==='sel')sg=[{t:c[1]+' '},{t:'Fasum',s:V.x_fs!=='Fasum'},{t:' / '},{t:'Non Fasum',s:V.x_fs!=='Non Fasum'},{t:' *)'}];
  else if(c[2]==='txt')sg=[{t:c[1]+' '},{t:V['x_'+c[0]]||'. . . . . . .'}];
  return{id:c[0],sg,w:bw+4+segW(sg,SZ,'A')}});
 const cw=[0,1,2].map(k=>Math.max(...items.filter((_,i)=>i%3===k).map(a=>a.w)));
 const gx=12;if(cw[0]+cw[1]+cw[2]+2*gx>CW)over=true;
 const xs3=[L,L+cw[0]+gx,L+cw[0]+cw[1]+2*gx];
 for(let r=0;r<4;r++){
  items.slice(r*3,r*3+3).forEach((it,k)=>{const x=xs3[k],t=y-bw+1;
   B.line(x,t,x+bw,t,.6);B.line(x,t+bw,x+bw,t+bw,.6);B.line(x,t,x,t+bw,.6);B.line(x+bw,t,x+bw,t+bw,.6);
   if(V['c_'+it.id]){B.line(x+1.5,t+1.5,x+bw-1.5,t+bw-1.5,1.1);B.line(x+bw-1.5,t+1.5,x+1.5,t+bw-1.5,1.1)}
   segs(x+bw+4,y,it.sg,SZ,'A')});
  y+=LH*1.3}
 y+=LH*.2;
 const ll=V.lain?wrap(V.lain,CW):[''];
 ll.forEach(s=>{if(s)T(s,L,y);B.line(L,y+2,R,y+2,.3);y+=LH*1.15});
 y+=LH*.4;
 const lv=(l,v)=>{const l2=80,a=wrap(v,CW-l2-8);T(l,L,y);T(':',L+l2,y);a.forEach((s,i)=>T(s,L+l2+8,y+i*LH));y+=a.length*LH};
 lv('Atas NOP',V.nop||dots(24));lv('Atas Nama',V.an||dots(24));
 lv('Yang berlokasi',(V.lokasi||dots(24))+' Kecamatan '+(V.upp||dots(12))+' '+(V.adm||dots(12)));
 y+=LH*.6;

 /* tabel */
 const TS=SZ*.92,TL=LH*.95,pad=3,c0=96,c1=(CW-c0)/2,xs=[L,L+c0,L+c0+c1,R];
 const rowT=(cells,o)=>{o=o||{};const f=o.bold?'AB':'A';
  const ls=cells.map((t,i)=>Array.isArray(t)?t:wrap(t||'',xs[i+1]-xs[i]-2*pad,TS,f).map(s=>[{t:s}]));
  const n=Math.max(1,...ls.map(a=>a.length));
  const h=Math.max(n*TL+2*pad,TS*1.3+2*pad+3,o.minH||0);
  if(o.gray)B.rect(L,y,CW,h,235);
  B.line(o.nt0?xs[1]:L,y,R,y,.6);B.line(o.nb0?xs[1]:L,y+h,R,y+h,.6);xs.forEach(x=>B.line(x,y,x,y+h,.6));
  ls.forEach((lines,i)=>lines.forEach((sg,k)=>{const w=segW(sg,TS,f),x=o.center?xs[i]+(xs[i+1]-xs[i]-w)/2:xs[i]+pad;const off=o.center?(h-2*pad-lines.length*TL)/2:0;segs(x,y+pad+off+TS*.82+k*TL,sg,TS,f)}));
  y+=h};
 const icon=(ya,yb)=>{const H=yb-ya;
  B.rect(L+.3,ya,c0-.3,H,255);
  B.line(L,ya,xs[1],ya,.6);B.line(L,yb,xs[1],yb,.6);B.line(L,ya,L,yb,.6);B.line(xs[1],ya,xs[1],yb,.6);
  const S=H-8,k=S/359,ox=L+c0/2-155*k,oy=ya+4,M=q=>[ox+q[0]*k,oy+q[1]*k],lw=Math.max(1.2,.05*S);
  const bez=(a,c,e,n)=>{const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*a[0]+2*u*t*c[0]+t*t*e[0],u*u*a[1]+2*u*t*c[1]+t*t*e[1]])}return o};
  const head=[];for(let i=0;i<=40;i++){const a=Math.PI+i/40*Math.PI;head.push([155+72*Math.cos(a),100+82*Math.sin(a)])}
  for(let i=1;i<40;i++){const a=i/40*Math.PI;head.push([155+72*Math.cos(a),100+100*Math.sin(a)])}
  const ls=bez([112,214],[16,230],[10,335],14),rs=ls.map(q=>[310-q[0],q[1]]),col=[];
  for(let i=0;i<=12;i++){const t=i/12;col.push([198-86*t,214+24*Math.sin(Math.PI*t)])}
  B.path(head.map(M),lw,true);
  B.path(ls.concat(rs.slice().reverse(),col).map(M),lw,true);
  B.path([[112,214],[108,176]].map(M),lw);B.path([[198,214],[202,176]].map(M),lw)};
 const house=(ya,yb)=>{B.rect(L+.3,ya,c0-.3,yb-ya,255);
  B.line(L,ya,xs[1],ya,.6);B.line(L,yb,xs[1],yb,.6);B.line(L,ya,L,yb,.6);B.line(xs[1],ya,xs[1],yb,.6);
  const S=yb-ya-8,k=S/170,ox=L+c0/2-97*k,oy=ya+4,M=q=>[ox+q[0]*k,oy+q[1]*k],lw=Math.max(1.1,.05*S);
  B.path([[8,92],[97,10],[186,92]].map(M),lw);
  B.path([[36,66],[36,24],[58,24],[58,46]].map(M),lw);
  B.path([[26,82],[26,150],[168,150],[168,82]].map(M),lw);

 line(a,b,c,d,w){doc.setLineWidth(w);doc.line(a,b,c,d)},
 rect(x,y,w,h,g){doc.setFillColor(g||0,g||0,g||0);doc.rect(x,y,w,h,'F');doc.setFillColor(0,0,0)},
 path(pt,w,c){const sg=[];for(let i=1;i<pt.length;i++)sg.push([pt[i][0]-pt[i-1][0],pt[i][1]-pt[i-1][1]]);doc.setLineWidth(w);doc.setLineCap('round');doc.setLineJoin('round');doc.lines(sg,pt[0][0],pt[0][1],[1,1],'S',!!c);doc.setLineCap('butt');doc.setLineJoin('miter')},

function cvB(ctx,k){const ft=(sz,f)=>{ctx.font=(f.indexOf('I')>0?'italic ':'')+(f.indexOf('B')>0?'bold ':'')+(sz*k)+'px '+(f[0]==='T'?'"Times New Roman",Times,"Liberation Serif",serif':'Arial,Helvetica,"Liberation Sans",sans-serif')};return{
 text(s,x,y,sz,f){ft(sz,f);ctx.fillText(s,x*k,y*k)},
 w(s,sz,f){ft(sz,f);return ctx.measureText(s).width/k},
 line(a,b,c,d,w){ctx.lineWidth=w*k;ctx.beginPath();ctx.moveTo(a*k,b*k);ctx.lineTo(c*k,d*k);ctx.stroke()},
 path(pt,w,c){ctx.beginPath();pt.forEach((q,i)=>i?ctx.lineTo(q[0]*k,q[1]*k):ctx.moveTo(q[0]*k,q[1]*k));if(c)ctx.closePath();ctx.lineWidth=w*k;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.lineJoin='miter';ctx.lineCap='butt'},
 rect(x,y,w,h,g){ctx.fillStyle=g?'rgb('+g+','+g+','+g+')':'#000';ctx.fillRect(x*k,y*k,w*k,h*k);ctx.fillStyle='#000'},
 img(){}}}
