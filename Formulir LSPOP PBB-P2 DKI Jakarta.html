<style>
:root{--bg:#eef1f5;--tbg:#0f4c81;--mut2:#5b6572;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#111;font:14px/1.4 Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:150;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--tbg);color:#fff}
.tb b{flex:1;min-width:180px}
.tb button,.pvbar button{border:0;border-radius:6px;padding:8px 14px;min-width:38px;font:700 14px Arial,Helvetica,sans-serif;cursor:pointer;background:#fff;color:#0f4c81;touch-action:manipulation}
.wrap{overflow-x:auto;padding:14px}
.note{color:var(--mut2);font-size:12px;max-width:820px;margin:8px auto;padding:0 14px}
.stage{overflow-x:auto}
.sheet{background:#fff;color:#000;width:215mm;height:330mm;display:flex;flex-direction:column;overflow:hidden;margin:0 auto;padding:5mm 7mm 4mm;font:7.5pt/1.25 Arial,Helvetica,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;margin-bottom:1mm}
.top span{border:.3mm solid #000;padding:.6mm 2mm}.top span:first-child{font-weight:700;font-size:8.5pt;border-width:.5mm}.top span:last-child{padding:.6mm 9mm}
.hd{display:flex;border:.3mm solid #000;text-align:center}.hd>div:first-child{flex:1;padding:1.5mm;display:flex;flex-direction:column;justify-content:center}.nfw{width:81mm;border-left:.3mm solid #000;display:flex;flex-direction:column}.nft{height:2.5mm;border-bottom:.3mm solid #000}.nfg{background:#c8c8c8;padding:.8mm 0;border-bottom:.3mm solid #000}.nfh{font-weight:700;font-size:6.5pt;padding:.4mm 0 .8mm}.nfb{display:flex;justify-content:center}.nfe{flex:1;min-height:3mm}
.hd .bg{font-size:9.5pt}
.nf{text-align:left}
.bar{background:#000;color:#fff;font-weight:700;text-align:center;padding:.5mm 0;margin-top:0;font-size:8pt}
.gr{background:#c8c8c8;padding:2mm 3.5mm;border-bottom:.3mm solid #000}.gr .lb{width:34mm;flex:none}.gr .ci{font-weight:700;font-size:6.8pt;align-items:center}.gr .fl{flex:1;justify-content:space-between}.gr .bx{width:4mm;height:4.6mm;font:700 9pt/4.4mm Arial;margin:0;background:transparent}.gr .b{background:transparent}
.rw{display:flex;align-items:center;gap:1.5mm}.nr{align-items:flex-start}.nr .lb{margin-top:4.3mm}.nr .sd{margin-top:3.5mm}
.lb{white-space:nowrap}
.sd{margin-left:auto;margin-right:12.5mm;display:grid;grid-template-columns:auto auto;column-gap:3mm;row-gap:1mm;align-items:center}
.sd div{display:contents}
.fl{display:flex;flex-wrap:wrap;gap:.8mm 4mm;align-items:center}
.ci{display:inline-flex;gap:1mm;align-items:flex-start}
.bx{flex:none;width:2.8mm;height:2.8mm;border:.25mm solid #000;background:#fff;font:normal 7pt/2.6mm Arial;text-align:center;margin-top:.2mm}
.bs{display:inline-flex}
.b{display:block;width:2.8mm;height:3.3mm;border:.25mm solid #000;background:#fff;font:700 7pt/3.1mm Arial;text-align:center;margin-right:-.25mm;overflow:hidden}
.np{display:inline-flex;gap:4mm}.nc:nth-child(2){margin-right:3.6mm}.np .b,.sd .b{width:4mm;height:4.6mm;font:700 8.5pt/4.4mm Arial}.sd .b{height:4.9mm}.nfb .b{width:3.8mm;height:3.9mm;font:700 8pt/3.7mm Arial;background:transparent}
.nc{display:flex;flex-direction:column}

.jg{display:grid;grid-template-columns:repeat(4,1fr);gap:1mm 3mm;padding:1mm}
.cell .t{font-weight:700;text-decoration:underline}
.wide{grid-column:1/-1}
.wide .cl{column-count:4;column-gap:3mm}
.sec{border-left:.3mm solid #000;border-right:.3mm solid #000;font-size:.87em}
.ro{display:grid;grid-template-columns:34mm 37.7mm 37.7mm 37.7mm 30mm 1fr;align-items:start;padding:.4mm 0 .4mm 4mm}
.ro .lb{margin-top:.5mm}.ro span.lb{font-weight:400;margin-top:.9mm}
.g2{grid-column:2/4;display:flex}.g3{grid-column:4/7;display:flex;align-items:center}
.sec .ci{font-weight:700;align-items:flex-start}
.sec .ci span{white-space:nowrap;line-height:3.2mm;margin-top:.6mm}
.sec .bx{width:3.8mm;height:4.4mm;margin:0;font:700 8pt/4.2mm Arial}
.sec .b{width:4.2mm;height:4mm;font:700 7.5pt/3.8mm Arial}
.rw2{display:flex;border-top:.3mm solid #000;padding:1mm;gap:4mm}
.rw2>div{flex:1;display:flex;flex-wrap:wrap;gap:1mm 3mm;align-items:center}
.kv{display:inline-flex;align-items:center;gap:1mm}
.ft{display:flex;justify-content:space-between;font-size:6pt;margin-top:1.2mm;padding:0 21mm 0 3.7mm}.ft span:first-child{font-weight:700;font-size:6.5pt}
.v5{border-bottom:.3mm solid #000}
.v{display:flex;border-top:.3mm solid #000}.v:first-child{border-top:0}
.v>.c{padding:0 0 0 3.7mm;box-sizing:border-box}.v>.c+.c{border-left:.3mm solid #000}
.v>.l{flex:none;width:51.6%}.v>.m{flex:none;width:19.4%;padding-left:4.2mm}.v>.r{flex:1;padding-left:4.1mm}
.fx{display:flex;align-items:center}.vl{white-space:nowrap}.vb,.v5 .v{font-weight:700}
.v .kv{gap:.3mm;font-weight:700;margin-right:3mm}
.v .b{width:3.9mm;height:4.4mm;font:700 7.5pt/4.2mm Arial}
.hh{line-height:3.2mm;margin:0 0 1mm .5mm}.v .col .kv{display:flex;margin-bottom:1.4mm}
.stk{display:flex;flex-direction:column}.mm{font-size:1.25em}
@media print{
 @page{size:215mm 330mm;margin:0}
 body{background:#fff}
 .wrap{display:block;padding:0;max-width:none}
 form{display:none}
 .stage{overflow:visible}
 .sheet{box-shadow:none;margin:0}
}

.sheet{color-scheme:light}
.sheet>*{flex:none}.sheet>.jg{flex:1 1 auto;align-content:space-evenly}
.sheet input.b,.sheet input.bx{appearance:none;-webkit-appearance:none;border-radius:0;padding:0;color:#000;font-family:Arial,Helvetica,sans-serif;outline:0}
.sheet input.b{text-align:center;text-transform:uppercase;min-width:0}
.sheet input.bx{display:grid;place-content:center;cursor:pointer;margin-top:.2mm}
.sec .ci input.bx,.gr .ci input.bx{margin-top:0}
.sheet input.bx:checked::after{content:"\2715"}
.sheet input.b:focus,.sheet input.bx:focus-visible{outline:1px solid #0f4c81;outline-offset:-1px;position:relative;z-index:1}
.sheet label.ci{cursor:pointer}
#pv{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;background:#2b2f36}
#pv.on{display:flex}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--tbg);color:#fff}
.pvbar b{flex:1;min-width:120px}
.pvbar span{min-width:48px;text-align:center;font-weight:700}
.pvbody{flex:1;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.pvsize{margin:0 auto;position:relative}
.pvin{width:813px;transform-origin:0 0}
.pvin canvas{display:block;width:813px;height:auto;margin:0 0 14px;background:#fff;box-shadow:0 2px 12px #0006}
@media print{.tb,.note,#pv{display:none!important}.sheet{transform:none!important;margin:0!important;height:329mm!important;max-height:329mm!important;overflow:hidden!important;break-after:avoid!important;page-break-after:avoid!important;break-inside:avoid!important}.stage{height:auto!important;overflow:visible!important}html,body{height:auto!important;margin:0!important;padding:0!important;overflow:hidden!important}.wrap{display:block!important;padding:0!important;gap:0!important;margin:0!important;max-width:none!important}}

  +'<div class="c m" style="padding-top:3.3mm"><div class="hh">22. JUMLAH LIFT</div><div class="col" style="margin-left:7mm">'+KV("Penumpang",s.lp,2)+KV("Kapsul",s.lk,2)+KV("Barang",s.lg,2)+'</div></div>'
  +'<div class="c r" style="padding-top:3.3mm;padding-left:8mm"><div class="hh">23. JUMLAH TANGGA BERJALAN</div><div class="fx" style="margin:0 0 1.2mm 3.7mm"><span style="width:18mm">Lebar &lt; 0,80 <span class="mm">m</span></span>'+B(s.tk,2)+'</div><div class="fx" style="margin-left:3.7mm"><span style="width:18mm">Lebar &gt; 0,80 <span class="mm">m</span></span>'+B(s.tl,2)+'</div></div></div>'
  +'</div>';
  
  
  
  h+='<div class="ft"><span>BAPENDA JAKARTA LSPOP PBB 01</span><span>Halaman 1 dari 1</span></div>';
  sheet.innerHTML=h;fit()}
function fit(){var b=6.25;sheet.style.fontSize=b+"pt";while(sheet.scrollHeight>sheet.clientHeight+1&&b>5){b-=.25;sheet.style.fontSize=b+"pt"}}
async function savePdf(btn){
  var old=btn.textContent,name="lspop-pbb-p2.pdf";
  if(!window.html2canvas||!window.jspdf){try{window.print()}catch(x){alert("Pustaka PDF belum termuat. Periksa koneksi internet, atau tekan Ctrl+P untuk mencetak.")}return}
  btn.disabled=true;btn.textContent="Menyiapkan PDF…";
  try{
    if(document.activeElement)document.activeElement.blur();
    var dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(x){}
    var cv=await shot();
    var pdf=new window.jspdf.jsPDF({unit:"mm",format:[215,330]});
    pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",0,0,215,330);
    var blob=pdf.output("blob");
    if(dl){await dl.save({filename:name,data:blob})}
    else{
      var touch=false;try{touch=matchMedia("(pointer:coarse)").matches}catch(x){}
      var shared=false;
      if(touch&&navigator.canShare&&window.File){
        try{var file=new File([blob],name,{type:"application/pdf"});
          if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});shared=true}}
        catch(x){if(x&&x.name==="AbortError")return}
      }
      if(!shared)pdf.save(name);
    }
  }catch(x){if(!x||(x.code!=="declined"&&x.name!=="AbortError"))alert("PDF gagal dibuat. Coba lagi, atau tekan Ctrl+P untuk mencetak.")}
  finally{btn.disabled=false;btn.textContent=old}
}
render();
var all=[].slice.call(sheet.querySelectorAll("input.b"));
function ok(c,e){return e.dataset.num==="1"?/\d/.test(c):/[A-Z0-9 .,\/\-'()&]/.test(c)}
function fillFrom(e,str){var i=all.indexOf(e),last=e;
  str.toUpperCase().split("").forEach(function(c){if(!ok(c,e)||i>=all.length)return;all[i].value=c;last=all[i];i++});
  (all[i]||last).focus()}
all.forEach(function(e,i){
  e.addEventListener("focus",function(){e.select()});
  e.addEventListener("input",function(){var v=e.value.toUpperCase();
    if(v.length>1){fillFrom(e,v);return}
    if(v&&!ok(v,e)){e.value="";return}
    e.value=v;if(v&&all[i+1])all[i+1].focus()});
  e.addEventListener("keydown",function(k){
    if(k.key==="Backspace"&&!e.value&&all[i-1]){all[i-1].value="";all[i-1].focus();k.preventDefault()}
    else if(k.key==="ArrowLeft"&&all[i-1]){all[i-1].focus();k.preventDefault()}
    else if(k.key==="ArrowRight"&&all[i+1]){all[i+1].focus();k.preventDefault()}});
  e.addEventListener("paste",function(k){k.preventDefault();fillFrom(e,((k.clipboardData||window.clipboardData).getData("text")||"").replace(/[\r\n\t]+/g," "))});
});
sheet.addEventListener("change",function(e){var t=e.target;
  if(t.type==="checkbox"&&t.checked)sheet.querySelectorAll('input[type=checkbox][data-g="'+t.dataset.g+'"]').forEach(function(o){if(o!==t)o.checked=false})});
function $(id){return document.getElementById(id)}
var Z=1,PXW=813;
function shot(){return window.html2canvas(sheet,{scale:(window.innerWidth<700?2:2.2),backgroundColor:"#ffffff",useCORS:true,windowWidth:1400,
  onclone:function(d){var sh=d.getElementById("sheet");sh.style.transform="none";sh.style.margin="0";
    sh.querySelectorAll("input.b").forEach(function(i){var b=d.createElement("b");b.className=i.className;b.textContent=i.value.toUpperCase();i.replaceWith(b)});
    sh.querySelectorAll("input.bx").forEach(function(i){var x=d.createElement("i");x.className="bx";x.textContent=i.checked?"\u2715":"";i.replaceWith(x)})}})}
window.zoomTo=function(z){Z=Math.max(.3,Math.min(3,z));var w=$("pvin");w.style.transform="scale("+Z+")";var q=$("pvsize");q.style.width=Math.round(PXW*Z)+"px";q.style.height=Math.round(w.offsetHeight*Z)+"px";$("zl").textContent=Math.round(Z*100)+"%"};
window.pfit=function(){zoomTo(Math.min(1,($("pvbody").clientWidth-32)/PXW))};
window.tampil=async function(){
  if(!window.html2canvas){alert("Pustaka pratinjau belum termuat. Periksa koneksi lalu coba lagi.");return}
  if(document.activeElement)document.activeElement.blur();
  var w=$("pvin");w.innerHTML='<p style="color:#fff">Menyiapkan pratinjau…</p>';
  $("pv").classList.add("on");document.body.style.overflow="hidden";
  try{var cv=await shot();w.innerHTML="";w.appendChild(cv)}catch(x){w.innerHTML='<p style="color:#fff">Pratinjau gagal dibuat.</p>'}
  pfit();$("pvbody").scrollTop=0};
window.tutup=function(){$("pv").classList.remove("on");document.body.style.overflow=""};
document.addEventListener("keydown",function(e){if(e.key==="Escape")tutup()});
window.reset=function(){all.forEach(function(e){e.value=e.dataset.d||""});sheet.querySelectorAll("input.bx").forEach(function(c){c.checked=false})};
window.simpanPDF=function(){savePdf($("bpdf"))};
})();
</script>
